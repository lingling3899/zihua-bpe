<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="2026 紫花油工展會：產品計數預訂、抽獎遊戲、宅配入會、推廣員更表。參考用途，非醫療建議。" />
  <title>2026 工展會 · 紫花油</title>
  <link rel="stylesheet" href="assets/css/app.css?v=20261101e" />
</head>
<body class="app-shell">
  <main class="wrap" id="mainWrap">
    <!-- 3D 展位 -->
    <section id="view-booth3d" class="hidden">
      <header class="booth3d-hero">
        <div class="booth3d-hero-text">
          <p class="booth3d-hero-kicker">2026 工展會</p>
          <h2>紫花油展位</h2>
        </div>
        <div class="booth3d-hero-actions">
          <button type="button" class="booth3d-login-btn" id="boothStaffLogin" aria-label="職員登入">
            <span aria-hidden="true">🔒</span>職員登入
          </button>
          <span class="booth3d-hint" aria-hidden="true">🖐 用手指轉 360°</span>
        </div>
      </header>
      <div id="boothStage" class="booth3d-stage" role="img" aria-label="紫花油展位 360 度檢視，可拖轉或自動旋轉"></div>
    </section>

    <!-- 展位地圖 -->
    <section id="view-map" class="hidden">
      <header class="page-hero">
        <p class="pc-hero-kicker">2026 工展會 · 紫花油</p>
        <h2>🗺️ 展位地圖</h2>
      </header>
      <section class="panel">
        <h3>第60屆工展會 · 維園</h3>
        <div class="fair-facts light">
          <div class="fair-fact"><strong>日期</strong><span>2026年12月12日至2027年1月4日（24天）</span></div>
          <div class="fair-fact"><strong>時間</strong><span>多數日子上午11時至晚上9時；1/4 提早至晚上8時</span></div>
          <div class="fair-fact"><strong>地點</strong><span>香港銅鑼灣維多利亞公園</span></div>
          <div class="fair-fact"><strong>交通</strong><span>港鐵銅鑼灣站 E 出口／天后站 A2 出口</span></div>
          <div class="fair-fact"><strong>入場</strong><span>$10；合資格免費；每晚7時起免費（最後一天除外）</span></div>
        </div>
        <p class="muted" style="margin-top:12px;">攤位編號／平面圖稍後更新。場內請跟大會指示牌。參考用途。</p>
        <div class="btn-row">
          <a class="primary link-btn" href="https://www.hkbpe.com.hk/web/subpage.php?mid=341" target="_blank" rel="noopener">官方場次頁</a>
          <button type="button" class="btn-ghost" data-jump-view="order">去產品計數</button>
        </div>
      </section>
    </section>

    <!-- 產品計數 -->
    <section id="view-order">
      <div id="dimsumOrderRoot" class="dimsum-root pc-root" aria-live="polite"></div>
    </section>

    <!-- 抽獎遊戲 -->
    <section id="view-games" class="hidden">
      <div id="luckyGamesRoot" aria-live="polite"></div>
    </section>

    <!-- 宅配入會 -->
    <section id="view-delivery" class="hidden">
      <div id="cupalDeliveryRoot" aria-live="polite"></div>
    </section>

    <!-- 推廣員更表 -->
    <section id="view-roster" class="hidden">
      <div id="rosterRoot" aria-live="polite"></div>
    </section>
  </main>

  <!-- 禮遇抽屜（職員／詳情） -->
  <div id="giftsDrawer" class="drawer hidden" role="dialog" aria-modal="true">
    <div class="drawer-panel">
      <div class="drawer-head">
        <h3>會場購物禮遇</h3>
        <button type="button" class="btn-ghost" id="btnCloseGifts">關閉</button>
      </div>
      <div id="giftsRoot"></div>
    </div>
  </div>

  <!-- Login modal -->
  <div id="loginModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <div class="modal">
      <h3 id="loginTitle">職員登入</h3>
      <form id="loginForm" autocomplete="on">
        <label class="field" for="loginUser">帳號</label>
        <input id="loginUser" name="username" type="text" required autocomplete="username" />
        <label class="field" for="loginPass">密碼</label>
        <div class="password-field">
          <input id="loginPass" name="password" type="password" required autocomplete="current-password" />
          <button type="button" class="password-toggle" aria-label="顯示密碼" data-toggle-pass="loginPass">👁</button>
        </div>
        <div class="btn-row">
          <button type="submit" class="primary">登入</button>
          <button type="button" class="btn-ghost" id="btnCancelLogin">取消</button>
        </div>
        <p id="loginMsg" class="admin-msg hidden" role="status"></p>
      </form>
    </div>
  </div>

  <!-- 隱藏登入入口（產品頁可用；主要喺更表） -->
  <div class="header-login-wrap floating-login">
    <button type="button" id="headerLoginBtn" class="header-login-btn" aria-label="職員登入" aria-haspopup="true" aria-expanded="false">
      <svg class="hdr-icon hdr-icon-out" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 19.5c0-3.6 3.1-6.5 7-6.5s7 2.9 7 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="hdr-icon hdr-icon-in hidden" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="8" r="3.5" fill="currentColor"/><path d="M5 19.5c0-3.6 3.1-6.5 7-6.5s7 2.9 7 6.5" fill="currentColor"/></svg>
      <span class="hdr-login-dot hidden" aria-hidden="true"></span>
    </button>
    <div id="loginDropdown" class="login-dropdown hidden" role="menu">
      <button type="button" role="menuitem" data-dd-action="gifts">🎁 禮遇設定</button>
      <button type="button" role="menuitem" data-dd-action="export-cupal">⬇ 匯出宅配 CSV</button>
      <button type="button" role="menuitem" data-dd-action="logout" class="dd-logout">🚪 登出</button>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="主要分頁">
    <button type="button" data-view="booth3d"><span class="bn-ico" aria-hidden="true">🧊</span><span>3D 展位</span></button>
    <button type="button" data-view="map"><span class="bn-ico" aria-hidden="true">🗺️</span><span>展位地圖</span></button>
    <button type="button" data-view="order" class="active"><span class="bn-ico" aria-hidden="true">🛍️</span><span>產品計數</span></button>
    <button type="button" data-view="games"><span class="bn-ico" aria-hidden="true">✨</span><span>抽獎遊戲</span></button>
    <button type="button" data-view="delivery"><span class="bn-ico" aria-hidden="true">🚚</span><span>宅配入會</span></button>
    <button type="button" data-view="roster"><span class="bn-ico" aria-hidden="true">📅</span><span>推廣員更表</span></button>
  </nav>

  <footer class="footer">
    紫花油工展會 · 參考用途，非醫療建議 ·

  </footer>

  <script src="assets/js/games-lucky.js?v=20261101e"></script>
  <script src="assets/js/cupal-delivery.js?v=20261101e"></script>
  <script src="assets/js/schedule-roster.js?v=20261101e"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="assets/js/booth-turntable.js?v=20261101e"></script>
  <script src="assets/js/app.js?v=20261101e"></script>
</body>
</html>
